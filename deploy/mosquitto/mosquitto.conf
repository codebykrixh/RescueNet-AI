# RescueNet AI — Mosquitto configuration (docs/07 T-09, docs/09 §4, AP-23)
#
# MQTT is NOTIFICATION-ONLY and is NEVER authoritative (AD-15).
# Authorisation is enforced here by a static ACL: the dashboard account is
# SUBSCRIBE-ONLY and cannot publish under any circumstances (AP-10).

# --- Authentication (AP-23: static password file, provisioned at deploy time) ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Authorization (AP-23: static ACL) ---
acl_file /mosquitto/config/acl

# --- Listeners ---
listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- Retained messages ---
# AP-09 forbids retained messages: a retained message would present itself as
# current state to a new subscriber, which is exactly the AD-15 failure mode.
# The backend publishes with retain=false; this cap is defence in depth.
retain_available false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
